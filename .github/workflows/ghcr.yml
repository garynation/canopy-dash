name: Publish Docker Image to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: building and pushing ghcr.io/garynation/canopy-dash:latest..."
            if docker build -t ghcr.io/garynation/canopy-dash:latest . && docker push ghcr.io/garynation/canopy-dash:latest; then
              echo "Successfully built and pushed ghcr.io/garynation/canopy-dash:latest"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1
